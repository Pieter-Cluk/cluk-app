name: Server logs

# Started by hand. Shows the latest errors from the app's log on one.com and
# tests outgoing connections (VIES, Microsoft) and lists the products ticked
# for the website with what they still miss. Changes nothing on the server.

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Read the log on one.com
        env:
          SSH_HOST: ssh.cys6r88bx.service.one
          SSH_USER: cys6r88bx_ssh
          SSHPASS: ${{ secrets.ONECOM_SSH_PASSWORD }}
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS=$(printf '%s' "$SSHPASS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          mkdir -p ~/.ssh && ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e ssh -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" 'bash -s' > report.txt 2>&1 <<'REMOTE'
          W=$(readlink -f ~/webroots/by-route/app.cluk.live_)
          cd "$W/app" || exit 1
          echo "== TAF 8016 and rigging clamps (read only)"
          php artisan tinker --execute='foreach (App\Models\ProductSales\SalesItem::where(fn ($q) => $q->where("number", "like", "%8016%")->orWhere("description", "like", "%8016%")->orWhere("manufacturer_code", "like", "%8016%")->orWhere("description", "like", "%uick%rigger%")->orWhere("type", "like", "%uick%rigger%"))->limit(8)->get() as $s) { echo "SALES ".json_encode($s->only(["id","number","brand","type","description","unit","list_price_cents","stock_qty","photo_path","weight_kg","width_m","length_m","height_m","category_id","subcategory_id","manufacturer_code"]), JSON_UNESCAPED_UNICODE).PHP_EOL; } echo "sales TAF brand count: ".App\Models\ProductSales\SalesItem::where("brand", "like", "%TAF%")->count().PHP_EOL; foreach (App\Models\ProductSales\SalesItem::where("brand", "like", "%TAF%")->limit(5)->get(["number","type","description"]) as $s) { echo "  TAF ".$s->number." | ".$s->type." | ".mb_substr((string) $s->description, 0, 80).PHP_EOL; } foreach (App\Models\Equipment\Item::where("subcategory_id", 72)->limit(10)->get() as $s) { echo "CLAMP ".$s->number." | ".$s->name." | serial=".($s->serial ? 1 : 0)." stock=".$s->stock_qty." day=".$s->day_price_cents." unit=".($s->price_unit ?? "-")." web=".($s->on_website ? 1 : 0)." kept=".($s->position_code ?? "-").PHP_EOL; } $p = App\Models\Warehouse\Position::where("code", "GA2B3")->first(); echo "GA2B3 ".($p ? $p->kind." ".$p->use." ".($p->active ? "on" : "off") : "missing")." kept here: ".App\Models\Equipment\Item::where("position_code", "GA2B3")->pluck("number")->implode(", ").PHP_EOL;' 2>&1 | tail -30
          echo "== migrations and labour rates"
          php artisan migrate:status 2>&1 | tail -4
          php artisan tinker --execute='foreach (App\Models\Sales\LabourType::orderBy("position")->get() as $t) { echo $t->name("en")." ".($t->price_cents === null ? "-" : $t->price_cents / 100)."/".$t->unit." ".($t->active ? "on" : "off").PHP_EOL; }' 2>&1 | tail -8
          curl -s -o /dev/null -m 15 -w 'site /login from server: %{http_code}\n' https://app.cluk.live/login || echo failed
          echo "== website activity today (per visitor, no personal data)"
          php artisan tinker --execute='$d = App\Services\Website\DigitalToday::get(); echo "total=".$d["total"]." web_events=".$d["web"]["events"]." visitors=".$d["web"]["visitors"]." views=".$d["web"]["views"]." actions=".$d["web"]["actions"]." social=".$d["social"]["interactions"]." reach=".$d["social"]["reach"].PHP_EOL; foreach ($d["sources"] as $s) { echo "  source ".$s["key"]."=".$s["n"].PHP_EOL; } $ev = DB::table("web_events")->where("created_at", ">=", today())->get(); foreach ($ev->groupBy("visitor_id") as $vid => $list) { $v = DB::table("web_visitors")->find($vid); echo "  visitor ".$vid." device=".($v->device ?? "?")." first_seen=".substr((string) ($v->first_seen_at ?? ""), 0, 16)." ref=".(parse_url((string) ($v->referrer ?? ""), PHP_URL_HOST) ?: "-")." utm=".($v->utm_source ?? "-")." linked=".(($v->email ?? null) || ($v->customer_account_id ?? null) ? "yes" : "no")." staff_domain=".(str_ends_with(strtolower((string) ($v->email ?? "")), "@cluk.live") ? "yes" : "no")." events=".$list->count()." ".json_encode($list->countBy("type")->all())." ".substr($list->min("created_at"), 11, 5)."-".substr($list->max("created_at"), 11, 5).PHP_EOL; }' 2>&1 | tail -30
          echo "== log files"; ls -la storage/logs/ 2>&1 | tail -5
          echo "== latest errors (message lines only)"
          cat storage/logs/laravel*.log 2>/dev/null | grep -E '^\[[0-9-]+ [0-9:]+\] [a-z]+\.(ERROR|WARNING|CRITICAL)' | tail -25 | cut -c1-600
          echo "== outgoing: VIES"
          curl -s -o /dev/null -m 15 -w '%{http_code}\n' https://ec.europa.eu/taxation_customs/vies/rest-api/check-vat-number -X POST -H 'Content-Type: application/json' -d '{"countryCode":"BE","vatNumber":"1010948054"}' || echo failed
          echo "== outgoing: Microsoft"
          curl -s -o /dev/null -m 15 -w '%{http_code}\n' https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration || echo failed
          echo "== outgoing: Graph"
          curl -s -o /dev/null -m 15 -w '%{http_code}\n' https://graph.microsoft.com/v1.0/ || echo failed
          echo "== settings present (names only)"
          grep -oE '^(MICROSOFT_[A-Z_]+|MAIL_[A-Z_]+|APP_URL|SESSION_[A-Z_]+)=' .env | tr '\n' ' '
          echo
          echo "== upload limits (PHP)"; php -r 'echo "upload_max_filesize=".ini_get("upload_max_filesize")." post_max_size=".ini_get("post_max_size")." gd=".(function_exists("imagecreatefromstring")?"yes":"no")." exif=".(function_exists("exif_read_data")?"yes":"no").PHP_EOL;'
          echo "== secret lengths"
          for k in MICROSOFT_CLIENT_SECRET DB_PASSWORD INTAKE_TOKEN; do v=$(grep "^$k=" .env | cut -d= -f2- | tr -d '"'); echo "$k: ${#v} chars"; done
          echo; echo "== social accounts (Meta permissions, read only)"
          for k in META_APP_ID META_APP_SECRET META_CONFIG_ID META_GRAPH_VERSION LINKEDIN_CLIENT_ID LINKEDIN_CLIENT_SECRET; do v=$(grep "^$k=" .env | cut -d= -f2- | tr -d '"'); echo "$k: ${#v} chars"; done
          php artisan tinker --execute='use Illuminate\Support\Facades\Http; $app = config("social.meta.app_id")."|".config("social.meta.app_secret"); $v = config("social.meta.version"); foreach (App\Models\Social\Account::whereIn("platform", ["facebook", "instagram"])->get() as $a) { $ps = App\Models\Social\Post::where("account_id", $a->id)->get(); $tags = $ps->flatMap(fn ($p) => App\Services\Website\SocialFeed::sections($p->text))->countBy()->all(); echo $a->id." ".$a->platform." ".$a->name." status=".$a->status." posts=".$ps->count()." oldest=".optional($ps->min("published_at"))->toDateString()." with_picture=".$ps->whereNotNull("thumb_path")->count()." tags=".json_encode($tags)." history=".($a->meta["history_at"] ?? "-")." last_sync=".$a->last_synced_at." error=".substr((string) $a->last_error, 0, 200).PHP_EOL; if (! $a->token) { echo "  no token".PHP_EOL; continue; } $d = Http::timeout(20)->get("https://graph.facebook.com/$v/debug_token", ["input_token" => $a->token, "access_token" => $app])->json("data") ?? []; echo "  type=".($d["type"] ?? "?")." valid=".json_encode($d["is_valid"] ?? null)." expires=".($d["expires_at"] ?? "?")." profile=".($d["profile_id"] ?? "-").PHP_EOL; echo "  scopes: ".implode(",", $d["scopes"] ?? []).PHP_EOL; foreach ($d["granular_scopes"] ?? [] as $g) { echo "  granular ".$g["scope"].": ".implode(",", $g["target_ids"] ?? ["all"]).PHP_EOL; } if (isset($d["error"])) { echo "  error: ".json_encode($d["error"]).PHP_EOL; } $r = Http::timeout(20)->get("https://graph.facebook.com/$v/".$a->external_id, ["fields" => "id,name", "access_token" => $a->token]); echo "  read page/account: ".$r->status()." ".substr($r->body(), 0, 300).PHP_EOL; }' 2>&1 | tail -40
          echo "== Facebook posts: which fields Meta allows (read only)"
          php artisan tinker --execute='use Illuminate\Support\Facades\Http; $a = App\Models\Social\Account::where("platform", "facebook")->first(); $v = config("social.meta.version"); if ($a && $a->token) { foreach (["published_posts?fields=id", "published_posts?fields=id,message,created_time,permalink_url", "published_posts?fields=id,full_picture", "published_posts?fields=id,attachments{media_type,media,target}", "published_posts?fields=id,shares", "published_posts?fields=id,reactions.summary(total_count).limit(0)", "feed?fields=id,message", "posts?fields=id,message"] as $q) { [$edge, $f] = explode("?fields=", $q); $r = Http::timeout(20)->get("https://graph.facebook.com/$v/".$a->external_id."/".$edge, ["fields" => $f, "limit" => 2, "access_token" => $a->token]); echo $q." => ".$r->status()." ".substr(str_replace("\n", " ", $r->body()), 0, 160).PHP_EOL; } }' 2>&1 | tail -12
          echo "== invoice numbering (read only)"
          php artisan tinker --execute='$me = App\Models\CompanyDetail::current(); echo "next now: ".App\Services\Finance\OkiOki\OkiOki::preview($me)." · change: ".(App\Services\Finance\OkiOki\OkiOki::previewChange($me) ?? "none").($me->invoice_change_on ? " from ".$me->invoice_change_on->toDateString() : "")." · numbered invoices: ".App\Models\Finance\PreInvoice::whereNotNull("invoice_number")->count().PHP_EOL;' 2>&1 | tail -3
          echo "== OkiOki sends (read only)"
          php artisan tinker --execute='$me = App\Models\CompanyDetail::current(); echo "link: ".($me->okioki_send ? "on" : "off")." inbox=".$me->okioki_inbox.PHP_EOL; foreach (App\Models\Finance\PreInvoice::latest("id")->take(5)->get() as $p) { echo $p->number." status=".$p->status." inv=".($p->invoice_number ?? "-")." sent=".($p->okioki_sent_at ?? "-")." ubl=".($p->ubl_path ? "yes" : "no")." error=".($p->okioki_error ?? "-").PHP_EOL; }' 2>&1 | tail -8
          echo "== invoice PDF test (read only, nothing stored)"
          php artisan tinker --execute='$pf = App\Models\Finance\PreInvoice::whereNotNull("invoice_number")->latest("id")->first(); if ($pf) { $t = microtime(true); $b = App\Services\Finance\InvoicePdf::make($pf); echo $pf->invoice_number." pdf=".strlen($b)." bytes, starts ".substr($b, 0, 5).", ".round(microtime(true) - $t, 1)."s".PHP_EOL; } else { echo "no numbered invoice".PHP_EOL; }' 2>&1 | tail -4
          echo "== warehouse zones (read only)"
          php artisan tinker --execute='foreach (App\Models\Warehouse\Zone::orderBy("sort")->get() as $z) { echo $z->sort." ".$z->code." ".$z->type." ".($z->name ?? "-")." cat=".json_encode($z->categories)." next=".json_encode($z->next)." ".($z->active ? "on" : "off").PHP_EOL; }' 2>&1 | tail -25
          echo; echo "== sales products online (read only, counts only)"
          php artisan tinker --execute='$all = App\Models\ProductSales\SalesItem::query(); echo "only_ticked=".json_encode(config("website.only_ticked"))." total=".(clone $all)->count()." active=".(clone $all)->where("active", true)->count()." ticked=".(clone $all)->where("on_website", true)->count()." visible=".App\Services\Website\SalesCatalogue::query()->count()." visible_without_subcategory=".App\Services\Website\SalesCatalogue::query()->whereNull("subcategory_id")->count()." visible_without_photo=".App\Services\Website\SalesCatalogue::query()->whereNull("photo_path")->count()." visible_price_0=".App\Services\Website\SalesCatalogue::query()->where("list_price_cents", 0)->count().PHP_EOL;' 2>&1 | tail -3
          echo; echo "== link check: every page and link, read only (rolled back)"
          timeout 900 php artisan cluk:link-check --as=pieter@cluk.live --site --max=2500 2>&1 | head -80
          echo; echo "== mail: sender and Graph permissions (read only)"
          php artisan tinker --execute='echo "mailer=".config("mail.default")." from=".config("mail.from.address").PHP_EOL; $r = Illuminate\Support\Facades\Http::asForm()->timeout(15)->post("https://login.microsoftonline.com/".config("services.microsoft.tenant")."/oauth2/v2.0/token", ["client_id" => config("services.microsoft.client_id"), "client_secret" => config("services.microsoft.client_secret"), "scope" => "https://graph.microsoft.com/.default", "grant_type" => "client_credentials"]); $t = (string) $r->json("access_token"); $p = $t ? json_decode(base64_decode(strtr(explode(".", $t)[1] ?? "", "-_", "+/")), true) : []; echo "token=".($t ? "ok" : "failed ".$r->json("error"))." roles=".implode(",", $p["roles"] ?? []).PHP_EOL; if ($t) { $q = Illuminate\Support\Facades\Http::withToken($t)->timeout(15)->get("https://graph.microsoft.com/v1.0/users/".rawurlencode(config("mail.from.address"))."/mailFolders/inbox/messages", ["\$top" => 1, "\$select" => "receivedDateTime"]); echo "read inbox: ".$q->status()." ".substr((string) $q->json("error.code"), 0, 60).PHP_EOL; }' 2>&1 | tail -5
          echo; echo "== bounces in the noreply inbox, last 30 days (read only, counts only)"
          php artisan tinker --execute='$r = Illuminate\Support\Facades\Http::asForm()->timeout(15)->post("https://login.microsoftonline.com/".config("services.microsoft.tenant")."/oauth2/v2.0/token", ["client_id" => config("services.microsoft.client_id"), "client_secret" => config("services.microsoft.client_secret"), "scope" => "https://graph.microsoft.com/.default", "grant_type" => "client_credentials"]); $t = (string) $r->json("access_token"); $box = rawurlencode(config("mail.from.address")); $q = Illuminate\Support\Facades\Http::withToken($t)->timeout(20)->get("https://graph.microsoft.com/v1.0/users/$box/mailFolders/inbox/messages", ["\$filter" => "receivedDateTime ge ".now()->subDays(30)->utc()->format("Y-m-d\TH:i:s\Z"), "\$top" => 200, "\$select" => "id,subject,from"]); $all = collect($q->json("value", [])); $b = $all->filter(fn ($m) => App\Services\Mail\Bounces::isBounce((string) ($m["subject"] ?? ""), (string) ($m["from"]["emailAddress"]["address"] ?? ""))); $found = 0; foreach ($b as $m) { $full = Illuminate\Support\Facades\Http::withToken($t)->withHeaders(["Prefer" => "outlook.body-content-type=\"text\""])->timeout(20)->get("https://graph.microsoft.com/v1.0/users/$box/messages/".rawurlencode($m["id"]), ["\$select" => "body"]); $txt = (string) ($m["subject"] ?? "")."\n".(string) $full->json("body.content", ""); $found += count(App\Services\Mail\Bounces::failed($txt)); preg_match_all("/[A-Z0-9._%+\x27-]+@([A-Z0-9.-]+\.[A-Z]{2,})/i", $txt, $mm); echo "  subject: ".mb_substr((string) $m["subject"], 0, 90)." | from domain: ".substr(strrchr((string) ($m["from"]["emailAddress"]["address"] ?? ""), "@"), 1)." | address domains: ".implode(",", array_unique($mm[1]))." | body chars ".strlen($txt).PHP_EOL; } echo "inbox status ".$q->status().", messages ".$all->count().", bounces ".$b->count().", known addresses in them ".$found.", blocked now ".App\Models\EmailBlock::active()->count().PHP_EOL;' 2>&1 | tail -3
          echo; echo "== OneDrive for backups (read only)"
          php artisan tinker --execute='$r = Illuminate\Support\Facades\Http::asForm()->timeout(15)->post("https://login.microsoftonline.com/".config("services.microsoft.tenant")."/oauth2/v2.0/token", ["client_id" => config("services.microsoft.client_id"), "client_secret" => config("services.microsoft.client_secret"), "scope" => "https://graph.microsoft.com/.default", "grant_type" => "client_credentials"]); $t = (string) $r->json("access_token"); $p = $t ? json_decode(base64_decode(strtr(explode(".", $t)[1] ?? "", "-_", "+/")), true) : []; echo "roles=".implode(",", $p["roles"] ?? [])." offsite_user=".(config("cluk.backup_offsite_user") ?: "-").PHP_EOL; foreach (["pieter@cluk.live", "info@cluk.live"] as $u) { $d = Illuminate\Support\Facades\Http::withToken($t)->timeout(15)->get("https://graph.microsoft.com/v1.0/users/".rawurlencode($u)."/drive", ["\$select" => "driveType,quota"]); echo $u.": ".$d->status()." ".($d->successful() ? $d->json("driveType")." free ".round(($d->json("quota.remaining") ?? 0) / 1073741824, 1)." GB" : $d->json("error.code")).PHP_EOL; } if ($ou = config("cluk.backup_offsite_user")) { $l = Illuminate\Support\Facades\Http::withToken($t)->timeout(15)->get("https://graph.microsoft.com/v1.0/users/".rawurlencode($ou)."/drive/root:/".rawurlencode(config("cluk.backup_offsite_folder")).":/children", ["\$select" => "name,size"]); echo "in OneDrive (".$l->status()."):".PHP_EOL; foreach ($l->json("value", []) as $i) { echo "  ".$i["name"]." ".round($i["size"] / 1048576, 1)." MB".PHP_EOL; } } $b = glob(App\Services\Backup\Backups::dir()."/cluk-*"); foreach ($b as $f) { echo "  ".basename($f)." ".round(filesize($f) / 1048576, 1)." MB".PHP_EOL; }' 2>&1 | tail -12
          echo; echo "== invitation audience (read only, counts only)"
          php artisan tinker --execute='$cust = App\Models\Company::where("is_customer", true); echo "customer companies: ".$cust->count().PHP_EOL; $rows = DB::table("contacts as c")->join("company_contact as cc", "cc.contact_id", "=", "c.id")->join("companies as co", "co.id", "=", "cc.company_id")->where("co.is_customer", true)->whereNotNull("c.email")->where("c.email", "!=", "")->selectRaw("upper(coalesce(co.country, \"??\")) as country, count(distinct lower(c.email)) as n, sum(c.promo_opt_out) as optout")->groupBy("country")->orderByDesc("n")->get(); foreach ($rows as $r) { echo $r->country." ".$r->n." (opt-out rows ".$r->optout.")".PHP_EOL; } echo "accounts on website: ".DB::table("customer_accounts")->count().PHP_EOL; echo "all contacts with email: ".DB::table("contacts")->whereNotNull("email")->where("email", "!=", "")->count().PHP_EOL; echo "total customer contacts with email: ".$rows->sum("n").PHP_EOL;' 2>&1 | head -14
          echo; echo "== softsteel items (read only)"
          F2=$(mktemp /tmp/ss.XXXX.php)
          cat > "$F2" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php'; $app = require getcwd().'/bootstrap/app.php'; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          use Illuminate\Support\Facades\DB;
          $items = App\Models\Equipment\Item::where(fn ($q) => $q->where('name', 'like', '%soft%steel%')->orWhere('number', 'like', '%SOFT%')->orWhere('name', 'like', '%softsteel%'))->get();
          foreach ($items as $i) {
              echo "ITEM {$i->id} {$i->number} | {$i->name} | kind={$i->kind} serial=".(int) $i->serial." stock={$i->stock_qty} kept=".($i->position_code ?? '-')." active=".(int) $i->active.PHP_EOL;
              $as = $i->assets()->get();
              echo '  pieces='.$as->count().' by status '.json_encode($as->countBy('status')).' by place '.json_encode($as->countBy(fn ($a) => ($a->location ?? '-').($a->case_id ? '/case'.$a->case_id : ''))).PHP_EOL;
              $ids = $as->pluck('id');
              echo '  order_assets='.DB::table('order_assets')->whereIn('asset_id', $ids)->count().' checks='.DB::table('warehouse_checks')->whereIn('asset_id', $ids)->count().' charges='.DB::table('warehouse_charges')->whereIn('asset_id', $ids)->count().' moves='.DB::table('warehouse_moves')->whereIn('asset_id', $ids)->count().' moves_item='.(Illuminate\Support\Facades\Schema::hasColumn('warehouse_moves', 'item_id') ? DB::table('warehouse_moves')->where('item_id', $i->id)->count() : 'n/a').PHP_EOL;
              echo '  case_items='.json_encode(DB::table('equipment_case_items')->where('item_id', $i->id)->get(['case_id', 'qty'])).' order_lines='.DB::table('order_lines')->where('item_id', $i->id)->count().' parents='.DB::table('equipment_components')->where('child_id', $i->id)->count().PHP_EOL;
              foreach ($as->take(3) as $a) { echo '   '.$a->code.' '.$a->status.' '.$a->location.' case='.($a->case_id ?? '-').' out='.($a->out_order_id ?? '-').PHP_EOL; }
          }
          foreach (DB::table('order_lines')->whereIn('item_id', $items->pluck('id'))->get() as $l) { $o = App\Models\Rental\Order::find($l->order_id); echo 'LINE '.json_encode($l).PHP_EOL.'  ORDER '.json_encode($o?->only(['id', 'number', 'status', 'out_from', 'out_until', 'loaded_at', 'returned_at', 'cancelled_at'])).' lines='.DB::table('order_lines')->where('order_id', $l->order_id)->count().PHP_EOL; }
          echo 'columns moves: '.implode(',', Illuminate\Support\Facades\Schema::getColumnListing('warehouse_moves')).PHP_EOL;
          PHP
          php "$F2" 2>&1 | tail -60; rm -f "$F2"
          echo; echo "== website downloads"
          ls -la storage/app/private/web-downloads storage/app/web-downloads 2>&1 | tail -15
          php artisan tinker --execute='foreach (App\Models\Website\Download::orderBy("sort")->get() as $d) { echo $d->id." | ".($d->title["en"] ?? "?")." | ".$d->category." | ".($d->active ? "on" : "off")." | ".$d->access." | ".$d->downloads.PHP_EOL; } echo "total: ".App\Models\Website\Download::count().PHP_EOL;' 2>&1 | tail -20
          echo; echo "== website catalogue check"
          F=$(mktemp /tmp/webcheck.XXXX.php)
          cat > "$F" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';
          $app = require getcwd().'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Facades\Schema;
          $tables = ['product_categories', 'product_subcategories', 'product_attributes', 'product_attribute_options', 'product_subcategory_attribute', 'product_tags', 'equipment_item_options', 'equipment_item_tag'];
          $miss = array_filter($tables, fn ($t) => ! Schema::hasTable($t));
          echo 'tables: '.($miss ? 'MISSING '.implode(', ', $miss) : 'all '.count($tables).' present').PHP_EOL;
          foreach (['category_id', 'subcategory_id', 'search_words', 'on_website'] as $c) { echo "equipment_items.$c: ".(Schema::hasColumn('equipment_items', $c) ? 'yes' : 'NO').PHP_EOL; }
          if ($miss) { exit; }
          $L = ['en', 'nl', 'fr', 'es'];
          $nm = fn ($j) => json_decode((string) $j, true) ?: [];
          $gaps = fn ($j) => implode(',', array_filter($L, fn ($l) => trim((string) ($nm($j)[$l] ?? '')) === ''));
          $cats = DB::table('product_categories')->orderBy('sort')->get();
          $subs = DB::table('product_subcategories')->orderBy('sort')->get();
          $items = DB::table('equipment_items')->where('kind', 'item')->get(['id', 'number', 'name', 'category_id', 'subcategory_id', 'on_website', 'active', 'descriptions', 'photo_path', 'search_words']);
          $web = $items->where('on_website', 1)->where('active', 1);
          echo PHP_EOL."== lists".PHP_EOL;
          echo 'categories '.$cats->count().' (active '.$cats->where('active', 1)->count().'), subcategories '.$subs->count().', attributes '.DB::table('product_attributes')->count().' with '.DB::table('product_attribute_options')->count().' choices, tags '.DB::table('product_tags')->count().PHP_EOL;
          $tr = $cats->filter(fn ($c) => $gaps($c->name))->map(fn ($c) => $c->code.' missing '.$gaps($c->name))->merge($subs->filter(fn ($s) => $gaps($s->name))->map(fn ($s) => $s->code.' missing '.$gaps($s->name)));
          echo 'names missing a language: '.($tr->count() ? $tr->implode('; ') : 'none').PHP_EOL;
          echo PHP_EOL."== items (kind item: ".$items->count().")".PHP_EOL;
          echo 'without category: '.$items->whereNull('category_id')->count().', without subcategory: '.$items->whereNull('subcategory_id')->count().PHP_EOL;
          $bad = $items->filter(fn ($i) => $i->subcategory_id && optional($subs->firstWhere('id', $i->subcategory_id))->category_id != $i->category_id);
          echo 'subcategory not in its category: '.$bad->count().($bad->count() ? ' e.g. '.$bad->take(5)->pluck('number')->implode(', ') : '').PHP_EOL;
          $offSub = $items->filter(fn ($i) => $i->subcategory_id && ! optional($subs->firstWhere('id', $i->subcategory_id))->active);
          echo 'in a switched-off subcategory: '.$offSub->count().PHP_EOL;
          $opt = DB::table('equipment_item_options')->count(); $tg = DB::table('equipment_item_tag')->count();
          echo "attribute values set: $opt on ".DB::table('equipment_item_options')->distinct()->count('item_id')." items; tags set: $tg on ".DB::table('equipment_item_tag')->distinct()->count('item_id').' items; items with search words: '.$items->filter(fn ($i) => trim((string) $i->search_words) !== '')->count().PHP_EOL;
          $wrongAttr = DB::table('equipment_item_options as io')->join('product_attribute_options as o', 'o.id', '=', 'io.option_id')->join('equipment_items as i', 'i.id', '=', 'io.item_id')
              ->leftJoin('product_subcategory_attribute as sa', fn ($j) => $j->on('sa.attribute_id', '=', 'o.attribute_id')->on('sa.subcategory_id', '=', 'i.subcategory_id'))->whereNull('sa.attribute_id')->count();
          echo "attribute values on a subcategory that doesn't use that attribute: $wrongAttr".PHP_EOL;
          echo PHP_EOL."== what the website gets: ".$web->count()." active items ticked".PHP_EOL;
          echo 'ticked without category/subcategory: '.$web->filter(fn ($i) => ! $i->category_id || ! $i->subcategory_id)->count().', without photo: '.$web->whereNull('photo_path')->count().', descriptions in all 4 languages: '.$web->filter(fn ($i) => ! $gaps($i->descriptions ?? '{}'))->count().PHP_EOL;
          foreach ($cats as $c) {
              $ci = $items->where('category_id', $c->id); $cw = $web->where('category_id', $c->id);
              echo $c->code.' '.($nm($c->name)['en'] ?? '?').' (nl: '.($nm($c->name)['nl'] ?? '?').'): '.$ci->count().' items, '.$cw->count().' on web'.($c->active ? '' : ' [OFF]').PHP_EOL;
              foreach ($subs->where('category_id', $c->id) as $s) {
                  $n = $items->where('subcategory_id', $s->id)->count(); $w = $web->where('subcategory_id', $s->id)->count();
                  echo '   '.$s->code.' '.($nm($s->name)['en'] ?? '?').": $n, web $w".($s->active ? '' : ' [OFF]').PHP_EOL;
              }
          }
          echo PHP_EOL."== ticked items with their new place".PHP_EOL;
          $optRows = DB::table('equipment_item_options as io')->join('product_attribute_options as o', 'o.id', '=', 'io.option_id')->join('product_attributes as a', 'a.id', '=', 'o.attribute_id')->whereIn('io.item_id', $web->pluck('id'))->get(['io.item_id', 'a.key', 'o.value'])->groupBy('item_id');
          $tagRows = DB::table('equipment_item_tag as it')->join('product_tags as t', 't.id', '=', 'it.tag_id')->whereIn('it.item_id', $web->pluck('id'))->get(['it.item_id', 't.slug'])->groupBy('item_id');
          foreach ($web->sortBy('name') as $i) {
              $c = $cats->firstWhere('id', $i->category_id); $s = $subs->firstWhere('id', $i->subcategory_id);
              $a = ($optRows[$i->id] ?? collect())->map(fn ($r) => $r->key.'='.$r->value)->implode(' ');
              echo $i->name.' | '.($c ? $nm($c->name)['en'] : '-').' > '.($s ? $nm($s->name)['en'] : '-').($a ? ' | '.$a : '').(isset($tagRows[$i->id]) ? ' | #'.$tagRows[$i->id]->pluck('slug')->implode(' #') : '').PHP_EOL;
          }
          PHP
          php "$F"; rm -f "$F"
          REMOTE
          echo "ssh exit: $?" >> report.txt

      - name: Report
        if: always()
        run: |
          sed '/== website catalogue check/,$d' report.txt | head -c 30000 | split -b 3500 - part_
          for f in part_*; do
            body=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=log ($f)::${body}"
          done

      - name: Website report
        if: always()
        run: |
          sed -n '/== website catalogue check/,$p' report.txt | head -c 34000 | split -b 3400 - web_
          for f in web_*; do
            body=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=website ($f)::${body}"
          done
