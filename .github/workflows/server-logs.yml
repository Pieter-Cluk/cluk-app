name: Server logs

# Started by hand. Shows the latest errors from the app's log on one.com and
# tests outgoing connections (VIES, Microsoft) and lists the products ticked
# for the website with what they still miss. Changes nothing on the server.

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Read the log on one.com
        env:
          SSH_HOST: ssh.cys6r88bx.service.one
          SSH_USER: cys6r88bx_ssh
          SSHPASS: ${{ secrets.ONECOM_SSH_PASSWORD }}
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS=$(printf '%s' "$SSHPASS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          mkdir -p ~/.ssh && ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e ssh -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" 'bash -s' > report.txt 2>&1 <<'REMOTE'
          W=$(readlink -f ~/webroots/by-route/app.cluk.live_)
          cd "$W/app" || exit 1
          echo "== log files"; ls -la storage/logs/ 2>&1 | tail -5
          echo "== latest errors (message lines only)"
          cat storage/logs/laravel*.log 2>/dev/null | grep -E '^\[[0-9-]+ [0-9:]+\] [a-z]+\.(ERROR|WARNING|CRITICAL)' | tail -25 | cut -c1-600
          echo "== outgoing: VIES"
          curl -s -o /dev/null -m 15 -w '%{http_code}\n' https://ec.europa.eu/taxation_customs/vies/rest-api/check-vat-number -X POST -H 'Content-Type: application/json' -d '{"countryCode":"BE","vatNumber":"1010948054"}' || echo failed
          echo "== outgoing: Microsoft"
          curl -s -o /dev/null -m 15 -w '%{http_code}\n' https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration || echo failed
          echo "== outgoing: Graph"
          curl -s -o /dev/null -m 15 -w '%{http_code}\n' https://graph.microsoft.com/v1.0/ || echo failed
          echo "== settings present (names only)"
          grep -oE '^(MICROSOFT_[A-Z_]+|MAIL_[A-Z_]+|APP_URL|SESSION_[A-Z_]+)=' .env | tr '\n' ' '
          echo
          echo "== upload limits (PHP)"; php -r 'echo "upload_max_filesize=".ini_get("upload_max_filesize")." post_max_size=".ini_get("post_max_size")." gd=".(function_exists("imagecreatefromstring")?"yes":"no")." exif=".(function_exists("exif_read_data")?"yes":"no").PHP_EOL;'
          echo "== secret lengths"
          for k in MICROSOFT_CLIENT_SECRET DB_PASSWORD INTAKE_TOKEN; do v=$(grep "^$k=" .env | cut -d= -f2- | tr -d '"'); echo "$k: ${#v} chars"; done
          echo; echo "== website products"
          F=$(mktemp /tmp/webcheck.XXXX.php)
          cat > "$F" <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';
          $app = require getcwd().'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Facades\Schema;
          foreach (['equipment_items', 'sales_items'] as $t) {
              echo "$t.on_website column: ".(Schema::hasColumn($t, 'on_website') ? 'yes' : 'NO (migration not run yet)').PHP_EOL;
          }
          if (! Schema::hasColumn('equipment_items', 'on_website')) { exit; }
          $eq = App\Models\Equipment\Item::query()->where('kind', 'item')->get();
          echo PHP_EOL."== DRY-HIRE: ".$eq->where('on_website', true)->count()." of ".$eq->count()." items ticked".PHP_EOL;
          echo "number | name | category > sub | brand | stock | price/day | photos | descriptions | active".PHP_EOL;
          foreach ($eq->where('on_website', true)->sortBy(['category', 'subcategory', 'name']) as $i) {
              $d = array_keys(array_filter((array) ($i->descriptions ?? [])));
              echo implode(' | ', [$i->number, $i->name, ($i->category ?: '-').' > '.($i->subcategory ?: '-'), $i->brand ?: '-',
                  $i->totalQty(), '€ '.number_format($i->day_price_cents / 100, 2, ',', '.'),
                  $i->photos()->count().($i->photo_path ? ' (main set)' : ' (no main)'),
                  $d ? implode(',', $d) : 'none', $i->active ? 'yes' : 'NO']).PHP_EOL;
          }
          echo PHP_EOL."== dry-hire categories: items, ticked, subcategories, pieces".PHP_EOL;
          foreach ($eq->groupBy(fn ($i) => $i->category ?: '-')->sortKeys() as $k => $g) {
              echo "$k: ".$g->count().', '.$g->where('on_website', true)->count().', '.$g->pluck('subcategory')->unique()->count().', '.$g->sum(fn ($i) => $i->totalQty()).PHP_EOL;
          }
          echo "items with any pieces or stock: ".$eq->filter(fn ($i) => $i->totalQty() > 0)->count().PHP_EOL;
          $s = App\Models\ProductSales\SalesItem::query()->get();
          echo PHP_EOL."== SALES: ".$s->where('on_website', true)->count()." of ".$s->count()." products ticked".PHP_EOL;
          echo "number | brand type | category | stock | list price | photo | description | active".PHP_EOL;
          foreach ($s->where('on_website', true)->sortBy(['category', 'type']) as $i) {
              echo implode(' | ', [$i->number, trim(($i->brand ?? '').' '.$i->type), $i->category ?: '-', $i->stock_qty,
                  '€ '.number_format($i->list_price_cents / 100, 2, ',', '.'), $i->photo_path ? 'yes' : 'no',
                  $i->description ? 'yes' : 'no', $i->active ? 'yes' : 'NO']).PHP_EOL;
          }
          PHP
          php "$F"; rm -f "$F"
          REMOTE
          echo "ssh exit: $?" >> report.txt

      - name: Report
        if: always()
        run: |
          head -c 60000 report.txt | split -b 3500 - part_
          for f in part_*; do
            body=$(sed 's/%/%25/g' "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=log ($f)::${body}"
          done
