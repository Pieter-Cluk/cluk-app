name: Help videos · voices
# Makes the spoken explanation of the Afrit 6 help videos (tools/afrit6-help/lines.json) and keeps it as an artifact.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the voices
        run: |
          pip install -q "piper-tts>=1.3" kokoro-onnx soundfile numpy
          mkdir -p /tmp/models && cd /tmp/models
          curl -sSfL -o nl.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/nl/nl_BE/nathalie/medium/nl_BE-nathalie-medium.onnx
          curl -sSfL -o nl.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/nl/nl_BE/nathalie/medium/nl_BE-nathalie-medium.onnx.json
          curl -sSfL -o kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          curl -sSfL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Speak
        run: python3 tools/afrit6-help/voices.py tools/afrit6-help/lines.json /tmp/voices /tmp/models/nl.onnx /tmp/models
      # The result goes to a separate branch "help-voices" (only voice files), fetched by whoever renders the videos.
      - name: Keep on the help-voices branch
        run: |
          sudo apt-get install -y -qq flac >/dev/null
          cd /tmp/voices && find . -name '*.wav' -exec flac -s --best --delete-input-file {} \;
          git config --global user.name "github-actions" && git config --global user.email "actions@github.com"
          git init -q -b help-voices /tmp/vrepo && cp -r /tmp/voices/. /tmp/vrepo/ && cd /tmp/vrepo
          git add -A && git commit -q -m "Help voices for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" help-voices
