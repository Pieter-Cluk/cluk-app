name: Test email

# Started by hand: the app on one.com sends a test email to the given address.

on:
  workflow_dispatch:
    inputs:
      to:
        description: Send the test email to
        required: true
        default: pieter@cluk.live

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - name: Send from the server
        env:
          SSH_HOST: ssh.cys6r88bx.service.one
          SSH_USER: cys6r88bx_ssh
          SSHPASS: ${{ secrets.ONECOM_SSH_PASSWORD }}
          TO: ${{ inputs.to }}
        run: |
          set +e
          case "$TO" in *@*.*) ;; *) echo "::error::Not an email address"; exit 1;; esac
          TO=$(printf '%s' "$TO" | tr -cd 'A-Za-z0-9@._+-')
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS=$(printf '%s' "$SSHPASS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          mkdir -p ~/.ssh && ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          out=$(sshpass -e ssh -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "cd \$(readlink -f ~/webroots/by-route/app.cluk.live_)/app && php artisan cluk:mail-test '$TO'" 2>&1)
          echo "::notice title=mail test::$(printf '%s' "$out" | tr '\n' ' ' | cut -c1-900)"
