name: Deploy to app.cluk.live

# Started by hand (Actions tab → "Deploy to app.cluk.live" → Run workflow).
# 1. runs the full test suite, 2. builds the app for production on PHP 8.4,
# 3. uploads it to one.com over SSH and switches over in one move.
# Secrets used (Settings → Secrets and variables → Actions):
#   ONECOM_SSH_PASSWORD, ONECOM_DB_PASSWORD, MICROSOFT_CLIENT_SECRET
#   INTAKE_TOKEN (optional: lets the cluk.live website form post into Incoming)
#   ANTHROPIC_API_KEY (optional: translates Media › Messages texts with Claude)
#   KBO_WS_USER, KBO_WS_PASSWORD (optional: live KBO register lookups for the credit check)
#   META_APP_ID, META_APP_SECRET, META_CONFIG_ID (optional: Media › Social media, Facebook and Instagram)
#   LINKEDIN_CLIENT_ID, LINKEDIN_CLIENT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (optional: Social media)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Not secret.
  SSH_HOST: ssh.cys6r88bx.service.one
  SSH_USER: cys6r88bx_ssh
  APP_URL: https://app.cluk.live
  DB_HOST: cys6r88bx.mysql.service.one.com
  DB_DATABASE: cys6r88bx_clukapp
  DB_USERNAME: cys6r88bx_clukapp
  MICROSOFT_CLIENT_ID: eb2f0282-587c-44c5-8583-25088023e6f7
  MICROSOFT_TENANT_ID: 2dbba26b-78b6-4b98-8756-66bc1196e1a5

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_sqlite, pdo_mysql, zip, gd, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the settings are filled in
        run: |
          for v in DB_HOST DB_DATABASE DB_USERNAME MICROSOFT_CLIENT_ID MICROSOFT_TENANT_ID; do
            if [ "${!v}" = "TO_FILL" ]; then echo "::error title=Missing setting::$v is not filled in yet in deploy.yml"; exit 1; fi
          done

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_mysql, zip, gd, fileinfo
          coverage: none

      - name: Build for production
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          bash deploy/fetch-fonts.sh || echo "::warning title=Fonts::website fonts could not be downloaded; the site uses the fallback fonts"
          echo "$GITHUB_SHA" > REVISION
          tar --exclude=.git --exclude=.github --exclude=tests --exclude=node_modules \
              --exclude='.env*' --exclude='storage/logs/*' -czf /tmp/build.tgz .

      - name: Write the server settings
        env:
          DB_PASSWORD: ${{ secrets.ONECOM_DB_PASSWORD }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          INTAKE_TOKEN: ${{ secrets.INTAKE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KBO_WS_USER: ${{ secrets.KBO_WS_USER }}
          KBO_WS_PASSWORD: ${{ secrets.KBO_WS_PASSWORD }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_CONFIG_ID: ${{ secrets.META_CONFIG_ID }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          cat > /tmp/env.new <<EOF
          APP_NAME=CLUK
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=${APP_URL}
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_TIMEZONE=Europe/Brussels
          LOG_CHANNEL=daily
          LOG_LEVEL=warning
          DB_CONNECTION=mariadb
          DB_HOST=${DB_HOST}
          DB_PORT=3306
          DB_DATABASE=${DB_DATABASE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD="$(trim "$DB_PASSWORD")"
          SESSION_DRIVER=database
          SESSION_LIFETIME=480
          SESSION_SECURE_COOKIE=true
          CACHE_STORE=database
          QUEUE_CONNECTION=database
          MAIL_MAILER=microsoft-graph
          MAIL_FROM_ADDRESS=${{ vars.MAIL_FROM_ADDRESS || 'noreply@cluk.live' }}
          MAIL_FROM_NAME=CLUK
          MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
          MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID}
          MICROSOFT_CLIENT_SECRET="$(trim "$MICROSOFT_CLIENT_SECRET")"
          MICROSOFT_REDIRECT_URI=${APP_URL}/auth/microsoft/callback
          INTAKE_TOKEN="$(trim "$INTAKE_TOKEN")"
          ANTHROPIC_API_KEY="$(trim "$ANTHROPIC_API_KEY")"
          KBO_WS_USER="$(trim "$KBO_WS_USER")"
          KBO_WS_PASSWORD="$(trim "$KBO_WS_PASSWORD")"
          META_APP_ID="$(trim "$META_APP_ID")"
          META_APP_SECRET="$(trim "$META_APP_SECRET")"
          META_CONFIG_ID="$(trim "$META_CONFIG_ID")"
          LINKEDIN_CLIENT_ID="$(trim "$LINKEDIN_CLIENT_ID")"
          LINKEDIN_CLIENT_SECRET="$(trim "$LINKEDIN_CLIENT_SECRET")"
          GOOGLE_CLIENT_ID="$(trim "$GOOGLE_CLIENT_ID")"
          GOOGLE_CLIENT_SECRET="$(trim "$GOOGLE_CLIENT_SECRET")"
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/env.new

      - name: Upload and switch over on one.com
        env:
          SSHPASS: ${{ secrets.ONECOM_SSH_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS=$(printf '%s' "$SSHPASS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          mkdir -p ~/.ssh && ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="sshpass -e ssh -o ConnectTimeout=20 $SSH_USER@$SSH_HOST"
          WEBROOT=$($SSH 'readlink -f ~/webroots/by-route/app.cluk.live_')
          echo "Web root: $WEBROOT"
          test -n "$WEBROOT"
          $SSH "mkdir -p '$WEBROOT/shared' && cat > '$WEBROOT/build.tgz'" < /tmp/build.tgz
          $SSH "cat > '$WEBROOT/shared/.env.new'" < /tmp/env.new
          $SSH "cat > '$WEBROOT/install.sh'" < deploy/server-install.sh
          $SSH "bash '$WEBROOT/install.sh' '$WEBROOT' '$WEBROOT/build.tgz' && rm -f '$WEBROOT/install.sh'" 2>&1 | tee /tmp/install.log

      - name: Check the site answers
        run: |
          # The web server sometimes needs a moment after the switch: try for up to a minute.
          for i in 1 2 3 4 5 6; do
            sleep 10
            c=$(curl -4 -s -o /dev/null -m 15 -w '%{http_code}' "$APP_URL/login" || true)
            echo "Try $i: HTTP $c"
            [ "$c" = "200" ] && break
          done
          # Straight to the one.com web server, so the app can be checked before DNS points there.
          ONECOM_IP=$(getent ahostsv4 3e3535bb.website.cys6r88bx.service.one | awk '{print $1}' | head -1)
          echo "one.com web server: $ONECOM_IP"
          direct=$(curl -s -k -o /tmp/direct.html -w '%{http_code}' --resolve "app.cluk.live:443:$ONECOM_IP" "$APP_URL/login" || true)
          [ "$direct" = "000" ] && direct=$(curl -s -o /tmp/direct.html -w '%{http_code}' --resolve "app.cluk.live:80:$ONECOM_IP" "http://app.cluk.live/login" || true)
          echo "Direct to one.com: HTTP $direct"
          if grep -q 'Microsoft' /tmp/direct.html; then echo "Direct: login page OK"; echo "DIRECT_PAGE=login page OK" >> "$GITHUB_ENV"; fi
          echo "DIRECT=$direct" >> "$GITHUB_ENV"
          code=$(curl -4 -s -o /tmp/login.html -w '%{http_code}' "$APP_URL/login" || true)
          echo "Public address: HTTP $code"
          echo "PUBLIC=$code" >> "$GITHUB_ENV"
          if [ "$code" = "200" ]; then exit 0; fi
          if [ "$code" = "000" ] && [ "$direct" = "200" ]; then
            echo "::warning title=Not reachable yet::The app works on one.com, but app.cluk.live does not point to one.com yet (DNS)."
            exit 0
          fi
          echo "::error title=Site check::app.cluk.live answered HTTP $code (direct to one.com: $direct)"
          exit 1

      - name: Report
        if: always()
        run: |
          body=$( (cat /tmp/install.log 2>/dev/null; echo; echo "Login page HTTP: public ${PUBLIC:-?}, direct to one.com ${DIRECT:-?} ${DIRECT_PAGE:-}") | tail -c 30000 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Deploy report::${body}"
