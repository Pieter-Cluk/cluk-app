name: Vendor bundle

# Started by hand. Installs the locked PHP packages and keeps them as a
# download, so the app can also be run in places without access to Packagist.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite, zip, gd, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Keep the packages on the branch "vendor-bundle" (replaced on every run)
        run: |
          tar -czf /tmp/vendor.tgz vendor
          cd /tmp && rm -rf bundle && mkdir bundle && cd bundle
          git init -q -b vendor-bundle
          cp /tmp/vendor.tgz .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor.tgz && git commit -qm "Installed packages for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" vendor-bundle
