name: one.com check

# Started by hand (Actions tab → "one.com check" → Run workflow).
# Logs in to one.com over SSH with the repository secrets and reports what
# the hosting offers: folders, PHP version and extensions, database client,
# composer and scheduled tasks. It changes nothing on the server.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Look around on one.com
        env:
          # Not secret: the one.com SSH host and account name.
          SSH_HOST: ssh.cys6r88bx.service.one
          SSH_USER: cys6r88bx_ssh
          SSHPASS: ${{ secrets.ONECOM_SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.ONECOM_SSH_PORT || '22' }}
        run: |
          set +e
          # Describe the secrets without revealing them.
          describe() { v="$1"; if [ -z "$v" ]; then echo "$2: EMPTY"; return; fi
            printf '%s: set, %s chars' "$2" "${#v}"
            case "$v" in *[[:space:]]*) printf ', contains spaces or line breaks';; esac
            case "$v" in *@*) printf ', contains @';; esac
            case "$v" in *:*) printf ', contains :';; esac
            echo; }
          { describe "$SSH_HOST" HOST; describe "$SSH_USER" USER; describe "$SSHPASS" PASSWORD; echo "PORT: $SSH_PORT"; } > secrets.txt
          # Tolerate stray spaces / line breaks around the values.
          SSH_HOST=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')
          SSH_USER=$(printf '%s' "$SSH_USER" | tr -d '[:space:]')
          SSH_PORT=$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')
          export SSHPASS=$(printf '%s' "$SSHPASS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "DNS check for $SSH_HOST: $(getent hosts "$SSH_HOST" | head -1 || true)" >> secrets.txt
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e ssh -p "$SSH_PORT" -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" 'bash -s' > report.txt 2>&1 <<'REMOTE'
          echo "== home: $(pwd)"
          ls -la ~ 2>&1 | head -40
          echo "== home contents"
          ls -la ~/ 2>&1 | head -30
          ACCOUNT=$(cd ~/ && pwd -P | sed 's#/users/.*##')
          echo "== account folder: $ACCOUNT"
          ls -la "$ACCOUNT" 2>&1 | head -30
          echo "== folders named like cluk.live (5 levels deep)"
          find "$ACCOUNT" -maxdepth 5 -type d \( -name '*cluk.live*' -o -name 'webroots' -o -name 'www' -o -name 'public_html' \) 2>/dev/null | head -30
          echo "== webroots (from the SSH home)"
          ls -la ~/webroots/ 2>&1 | head -20
          for d in ~/webroots/*/ "$ACCOUNT"/webroots/*/; do echo "-- $d"; ls -la "$d" 2>&1 | head -12; [ -w "$d" ] && echo "(writable)" || echo "(not writable)"; done 2>/dev/null | head -80
          echo "== writable from SSH?"
          for d in $(find "$ACCOUNT" -maxdepth 5 -type d -name '*cluk.live*' 2>/dev/null | head -5); do [ -w "$d" ] && echo "writable: $d" || echo "read-only: $d"; ls -la "$d" 2>&1 | head -8; done
          echo "== php"
          php -v 2>&1 | head -1
          echo "== php extensions"
          php -m 2>&1 | tr '\n' ' '
          echo
          echo "== composer"
          command -v composer || echo "no composer"
          echo "== database client"
          (mariadb --version || mysql --version) 2>&1 | head -1
          echo "== crontab"
          command -v crontab && (crontab -l 2>&1 | head -5) || echo "no crontab command"
          echo "== disk"
          df -h ~ 2>&1 | tail -1
          REMOTE
          echo "ssh exit code: $?" >> report.txt

      - name: Check app.cluk.live from the internet
        if: always()
        run: |
          {
            echo "== DNS app.cluk.live: $(getent hosts app.cluk.live | head -2 | tr '\n' ' ')"
            echo "== DNS cluk.live: $(getent hosts cluk.live | head -1)"
            echo "== http://app.cluk.live/login"
            curl -s -o /dev/null -m 20 -w 'HTTP %{http_code} redirect=%{redirect_url}\n' http://app.cluk.live/login || echo "no answer"
            echo "== https://app.cluk.live/login"
            curl -s -o /tmp/l.html -m 20 -w 'HTTP %{http_code}\n' https://app.cluk.live/login || echo "no answer"
            curl -sv -o /dev/null -m 20 https://app.cluk.live/login 2>&1 | grep -E 'subject:|issuer:|expire|SSL|Connected|Could not|error' | head -8
            grep -o 'Sign in with Microsoft' /tmp/l.html 2>/dev/null | head -1
          } >> report.txt 2>&1

      - name: Show the report as an annotation
        if: always()
        run: |
          body=$(cat secrets.txt report.txt 2>/dev/null | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=one.com report::${body}"
